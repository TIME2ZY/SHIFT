name: Test

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: Verify pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Product and CI share the same authority path. Legacy-mode tests must
      # opt into files/dual explicitly instead of inheriting a fallback.
      SHIFT_STORAGE_MODE: sqlite

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pull request
        run: npm run verify:pr
